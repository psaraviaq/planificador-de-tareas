<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planificador de tareas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" />
  </head>
  <body class="min-vh-100 bg-light">
    <main class="container-lg px-4 py-5 col-sm-10 col-md-8 col-lg-6 col-xl-5">
      <div class="mb-4">
        <a href="../index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none text-primary">
          <i class="bi bi-arrow-left-short fs-3"></i><span>Volver a mis tareas</span>
        </a>
      </div>

      <div class="border rounded-3 bg-white p-4 p-md-5">
        <div class="mb-4">
          <h1 class="h3 fw-semibold text-dark mb-1">Editar tarea</h1>
          <p class="text-secondary small">Actualiza los detalles de tu tarea.</p>
        </div>
        <form id="form-editar-tarea" class="d-flex flex-column gap-3">
          <div>
            <label for="editar-titulo" class="form-label small fw-medium text-secondary mb-1">Tarea</label>
            <input type="text" class="form-control" id="editar-titulo" value="Preparar entrega de React" required />
          </div>
          <div>
            <label for="editar-descripcion" class="form-label small fw-medium text-secondary mb-1">Descripción (opcional)</label>
            <textarea class="form-control" id="editar-descripcion" rows="3" placeholder="Añade una descripción…"></textarea>
          </div>
          <div>
            <label for="editar-fecha" class="form-label small fw-medium text-secondary mb-1">Fecha de entrega</label>
            <input type="date" class="form-control" id="editar-fecha" value="2026-11-20" />
          </div>
          <div>
            <label for="editar-categoria" class="form-label small fw-medium text-secondary mb-1">Categoría (opcional)</label>
            <select class="form-select" id="editar-categoria">
              <option value="">Sin categoría</option>
              <option value="Estudio" selected>Estudio</option>
              <option value="Personal">Personal</option>
              <option value="Trabajo">Trabajo</option>
            </select>
          </div>
          <hr class="my-2 text-secondary" />
          <div class="d-flex justify-content-end gap-2">
            <a href="../index.html" class="btn btn-outline-secondary px-3 py-2 fw-medium">Cancelar</a>
            <button type="submit" class="btn btn-primary px-3 py-2 fw-medium">Guardar cambios</button>
          </div>
        </form>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
