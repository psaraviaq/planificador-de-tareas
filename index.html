<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planificador de tareas</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css" />
  </head>

  <body class="min-vh-100 bg-light">
    <header class="d-flex align-items-center justify-content-between bg-white border-bottom px-4 py-3 px-md-5 py-md-4">
      <a class="d-inline-flex align-items-center gap-2 my-1 my-md-0 text-decoration-none text-dark fw-semibold" href="index.html">
        <i class="bi bi-check-square fs-4 lh-1 text-primary"></i><span>Mis tareas</span>
      </a>
      <p class="my-1 my-md-0 text-secondary small">Un día a la vez.</p>
    </header>

    <main class="container-lg px-4 py-5 col-lg-8">
      <div class="mb-4">
        <h1 class="h3 fw-semibold text-dark mb-1">Mi lista de tareas</h1>
        <p class="text-secondary small">Un lugar sencillo para organizar tu día.</p>
      </div>

      <article class="d-flex align-items-center gap-2 border rounded-3 bg-white px-2 px-md-3 py-3">
        <input role="button" class="form-check-input border-secondary-subtle fs-5 flex-shrink-0 ms-1" type="checkbox" />
        <div class="flex-grow-1 ms-1">
          <p class="mb-1">Preparar entrega de React</p>
          <div class="d-flex align-items-center gap-2">
            <span class="badge bg-primary bg-opacity-10 text-primary fw-normal">Estudio</span>
            <span class="text-secondary small"><i class="bi bi-calendar"></i> 20 nov</span>
          </div>
        </div>
        <div class="d-flex align-items-center gap-1 me-1">
          <button class="btn btn-link link-secondary p-2" type="button" title="Editar"><i class="bi bi-pencil fs-5"></i></button>
          <button class="btn btn-link link-secondary p-2" type="button" title="Eliminar"><i class="bi bi-trash3 fs-5"></i></button>
        </div>
      </article>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
